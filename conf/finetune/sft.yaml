pretrained_path: ${paths.checkpoint}/ckpt.pt

# 입출력 형식 확인 후 컬럼명, 템플릿 수정
prompt_template: "{question}\nA. {choices[0]}\nB. {choices[1]}\nC. {choices[2]}\nD. {choices[3]}\nAnswer:"  # 입력 컬럼을 {컬럼명}으로 넣음.
answer_options: ["A", "B", "C", "D"]
val_size: 0.02
split_seed: ${seed}

batch_size: 16
gradient_accumulation_steps: 4
num_epochs: 3
learning_rate: 0.00005  # 사전학습 지식을 덜 망가뜨리기 위해 pretrain보다 작게 둠.
min_lr: 0.000005
warmup_ratio: 0.03
adam_betas: [0.9, 0.95]
weight_decay: 0.1
max_grad_norm: 1.0
dropout: 0.1  # 데이터가 작아 과적합 방지 의도임.

eval_steps: 100
log_steps: 10
seed: ${seed}

# 학습 중 샘플 생성
max_new_tokens: 100
temperature: 0.8
top_k: 50
