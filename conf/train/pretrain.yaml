batch_size: 32  # gpu 메모리에 맞게 조절
gradient_accumulation_steps: 4
max_steps: 200
learning_rate: 0.0006
min_lr: 0.00006
warmup_steps: 200
adam_betas: [0.9, 0.95]
weight_decay: 0.1
max_grad_norm: 1.0  # gradient clipping

eval_steps: 250
eval_iters: 50
log_steps: 10
num_workers: 2
resume_from_checkpoint: false
seed: ${seed}

# 학습 중 샘플 생성
sample_prompt: "The meaning of education is"
max_new_tokens: 100
temperature: 0.8
top_k: 50
