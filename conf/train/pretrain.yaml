batch_size: 16  # gpu 메모리에 맞게 조절
gradient_accumulation_steps: 32  # step당 약 0.5M 토큰임.
max_steps: 8000  # 약 4.2B 토큰임.
learning_rate: 0.0003
min_lr: 0.00003
warmup_steps: 400
decay_ratio: 0.2  # WSD. 마지막 20% 구간만 min_lr까지 선형 감소함.
z_loss: 0.0001  # 출력 logit 크기 억제용임.
adam_betas: [0.9, 0.95]
weight_decay: 0.1
max_grad_norm: 1.0  # gradient clipping

eval_steps: 500
eval_iters: 50
log_steps: 10
num_workers: 4
compile: true
resume_from_checkpoint: false
seed: ${seed}

# 학습 중 샘플 생성
sample_prompt: "The meaning of education is"
max_new_tokens: 100
temperature: 0.8
top_k: 50
