# download.py
download_pattern: sample/10BT/00[0-6]_00000.parquet  # 7개 파일 약 5B 토큰임.

# split_dataset.py
val_size: 0.0005
test_size: 0.0005
split_seed: ${seed}
num_proc: 8

# preparetoken.py
max_train_docs: 0  # 0 = 전체
max_val_docs: 0  # 0 = 전체
seq_len: 1024  # 모델 context 길이
encode_batch_docs: 1024  # 토큰화할 때 batch 문서 수
verify_batch_size: 4  
